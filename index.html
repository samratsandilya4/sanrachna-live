<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Standard Favicon (Original HD logo untouched) -->
    <link rel="icon" type="image/png" href="/sanrachna-official-logo.png" />
    <link rel="apple-touch-icon" href="/sanrachna-official-logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Luxury Editorial & Calligraphy Fonts for संRACHNA Studio & Certificates -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Great+Vibes&family=IBM+Plex+Mono:wght@600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- SEO Meta Tags -->
    <title>संRACHNA | GEC Godda — Official College Magazine</title>
    <meta
      name="description"
      content="Official annual college magazine of GEC Godda. Submit your articles, poems, stories, artwork & photography to Sanrachna and track live editorial status."
    />
    <meta name="theme-color" content="#881337" />
    <link rel="canonical" href="https://sanrachna-live.vercel.app/" />

    <!-- Google Site Name & Alternate Spellings Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "संRACHNA | GEC Godda",
        "alternateName": [
          "Sanrachna",
          "Sanrachna GEC Godda",
          "Sanrachna Magazine",
          "संरचना"
        ],
        "url": "https://sanrachna-live.vercel.app/"
      }
    </script>

    <!-- Open Graph (WhatsApp, Telegram, LinkedIn, Discord Share Preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sanrachna-live.vercel.app/" />
    <meta property="og:site_name" content="संRACHNA | GEC Godda" />
    <meta property="og:title" content="संRACHNA | GEC Godda — Magazine Submission Portal" />
    <meta
      property="og:description"
      content="Submit your articles, poems, stories, artwork & photography for संRACHNA (Theme: The Zero / शून्य) and track live editorial status."
    />
    <meta
      property="og:image"
      content="https://sanrachna-live.vercel.app/og-logo.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="संRACHNA Official Logo — GEC Godda" />

    <!-- Twitter / X Preview Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="संRACHNA | GEC Godda — Magazine Submission Portal" />
    <meta
      name="twitter:description"
      content="Submit your articles, poems, stories, artwork & photography for संRACHNA (Theme: The Zero / शून्य) and track live editorial status."
    />
    <meta
      name="twitter:image"
      content="https://sanrachna-live.vercel.app/og-logo.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
